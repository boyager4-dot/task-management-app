{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white p-8 rounded-xl shadow">
  <h1 class="text-xl font-semibold mb-6 text-center">เข้าสู่ระบบ</h1>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm text-slate-600 mb-1">ชื่อผู้ใช้</label>
      <input type="text" name="username" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-slate-600 mb-1">รหัสผ่าน</label>
      <input type="password" name="password" required class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-slate-900 text-white py-2 rounded hover:bg-slate-800">
      เข้าสู่ระบบ
    </button>
  </form>
</div>
{% endblock %}
